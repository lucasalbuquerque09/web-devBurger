<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="src/css/style.css">

    <title>Dev Burger | L.A</title>

</head>

<body>
    <!-- cabeçalho -->
    <header id="header">

        <div class="interface box-header">

            <div id="logo-header">Burger Dev</div>
            <!-- menu-desktop -->
            <nav id="manu-header">

                <ul>

                    <li><a href="#" id="active-menu">All</a></li>

                    <li><a href="#">Meat</a></li>

                    <li><a href="#">Veggir</a></li>

                    <li><a href="#">Drinks</a></li>

                    <li><a href="#">Sides</a></li>

                </ul>

            </nav>

            <div id="cart-header">

                <i class="bi bi-cart4" id="cart-menu"></i>
                <i class="bi bi-list" id="btn-mobile"></i>

            </div>

            

            <nav id="manu-mobile">
                <div class="box-btn-mobile">
                    <i class="bi bi-x-lg"></i>
                </div>

                <ul>

                    <li><a href="#">All</a></li>

                    <li><a href="#">Meat</a></li>

                    <li><a href="#">Veggir</a></li>

                    <li><a href="#">Drinks</a></li>

                    <li><a href="#">Sides</a></li>

                </ul>

            </nav>
            
            <div id="overlay"></div>

        </div>


    </header>

    <main id="main-container">
        <!-- seção banner -->
        <section class="interface container-banner">
            <div id="banner">
                <!-- Informações do Banner -->
                <div id="info-banner">

                    <span id="span-banner">Limited Edition</span>

                    <h1>The Monstrous <br><span>Maxima</span></h1>

                    <p>Engineered for absolute satisfaction. Triple-stacked wagyu beef, caramelized onions, and our
                        secret tech-sauce signature blend.</p>

                    <div id="btn-banner">

                        <button type="submit" id="left">Order Now</button>

                        <button type="submit" id="right">Details</button>

                    </div>

                </div>

                <!-- Imagem do Banner -->
                <div id="img-banner">

                    <img src="src/img/x-mostruoso-banner.jpg" alt="x-mostruoso-banner">

                </div>

            </div>

        </section>

        <!-- seção menu btn -->

        <section class="interface menu-btn">
            <div id="box-btn">
                <button type="submit" id="btnShowAll"><i class="bi bi-fork-knife"></i> show all</button>

                <button type="submit" id="btnDiscount">Discount</button>

                <button type="submit" id="btnSummary">Summary</button>

                <button type="submit" id="btnVegan">Vegan</button>

            </div>

        </section>

        <!-- seção cartões de produto -->
        <section class="interface">

            <div id="box-card">

                <ul class="card-list"></ul>

            </div>

        </section>

    </main>

    <script src="src/js/products.js"></script>
    <script src="src/js/script.js"></script>

</body>

</html>
